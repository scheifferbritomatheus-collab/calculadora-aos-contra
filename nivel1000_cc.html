<!DOCTYPE html>
<html lang="pt-br">
<head>
  <!-- Developed by: Matheus Scheiffer Brito | Google Gemini Designed by: Google Gemini -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nivel 1000 - Multiplicação</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex; /* Centraliza o card */
      justify-content: center;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(-45deg, #000000, #191727, #00025c, #0a0a2e);
      background-size: 400% 400%;
      animation: gradient 15s ease infinite;
      overflow: hidden;
    }

    @keyframes gradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(255, 255, 255, 0.05); /* Fundo semi-transparente */
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
      text-align: center;
      width: 320px;
    }

    h1 { color: #00ffff; font-size: 1.5rem; margin-bottom: 20px; }
    h3 { color: #ccc; margin-bottom: 10px; }
    
    #texto { 
      font-size: 2.5rem; 
      color: #fff; 
      margin: 20px 0;
      font-weight: 600;
    }

    input {
      width: 80%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      outline: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    button {
      width: 85%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background: #00ffff;
      color: #000;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      background: #00cccc;
      transform: scale(1.05);
    }

    #certao {
      margin-top: 20px;
      font-size: 1rem;
      min-height: 1.2em; /* Evita que o card "pule" quando o texto aparece */
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Calculadora ao Contrário</h1>
    <h3>A conta é:</h3>
    <h3 id="texto"></h3>
    <input type="number" id="i" placeholder="Sua resposta...">
    <button onclick="verificar()">Verificar</button>
    <h2 id="certao"></h2>
    
  </div>
  
   
  <script>
    const num1 = Math.floor(Math.random() * 1000);
    const num2 = Math.floor(Math.random() * 1000);
    const num4 = num1 * num2;

    document.getElementById("texto").textContent = `${num1} x ${num2}`;
    const elemento2 = document.getElementById("certao");

    function verificar() {
      const res = document.getElementById("i").value;

      if (Number(res) === num4) {
        elemento2.style.color = "#00ff88";
        elemento2.textContent = "Boa! Passou de nível!";
        
        // --- O SEGREDO ESTÁ AQUI ---
        setTimeout(() => {
          location.reload(); // Recarrega a página
        }, 5000); // 5000 milissegundos = 5 segundos
        // ---------------------------
        
      } else {
        elemento2.style.color = "#ff4444";
        elemento2.textContent = "Errado! Tente de novo.";
      }
    }

    document.getElementById("i").addEventListener("keypress", function(event) {
      if (event.key === "Enter") {
        verificar();
      }
    });
  </script>
</body>
</html>
